<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>360° Viewer</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Patrick+Hand&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --hand: "Patrick Hand", "Caveat", system-ui, sans-serif;
    --display: "Caveat", "Patrick Hand", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
    --ink: #1a1a1a;
    --paper: #fbf8f3;
  }
  html, body, #app {
    margin: 0;
    height: 100%;
    background: var(--paper);
    font-family: var(--hand);
    color: var(--ink);
    overflow: hidden;
  }
  button { font-family: var(--hand); }
  @keyframes pano-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div id="app" data-screen-label="360 Viewer"></div>

  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="pano-viewer.jsx"></script>

  <script type="text/babel">
    ReactDOM.createRoot(document.getElementById('app')).render(
      <PanoViewer title="Déchetterie - 360°" />
    );
  </script>
</body>
</html>
